<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=night-2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EFEFF7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Regulated" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=night-2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Regulated – Personalized nervous system regulation. Custom audio sessions built for your specific patterns." />
    <script>
      // Look switch: classic, night (Night Sleeper) or admiralty (paper and navy). VITE_LOOK sets the
      // build default; ?look=night, ?look=admiralty or ?look=classic overrides it and is remembered on
      // this device. Runs before first paint.
      (function () {
        var LOOKS = { night: '#0B1124', admiralty: '#EFEFF7', classic: '' }
        var look = LOOKS.hasOwnProperty('%VITE_LOOK%') ? '%VITE_LOOK%' : 'classic'
        try {
          var asked = new URLSearchParams(location.search).get('look')
          if (LOOKS.hasOwnProperty(asked)) localStorage.setItem('regulated_look', asked)
          var saved = localStorage.getItem('regulated_look')
          if (LOOKS.hasOwnProperty(saved)) look = saved
        } catch (e) {}
        document.documentElement.setAttribute('data-look', look)
        if (look === 'classic') return
        var tint = document.querySelector('meta[name="theme-color"]')
        if (tint) tint.setAttribute('content', LOOKS[look])
        // Dark status bar text on the light paper look.
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
        if (bar) bar.setAttribute('content', look === 'admiralty' ? 'default' : 'black-translucent')
      })()
    </script>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/theme/night.css" />
    <link rel="stylesheet" href="/src/theme/admiralty.css" />
    <title>Regulated</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #EFEFF7; }
      body { overflow-x: hidden; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
